# nginx site for the collector, for boxes that already run nginx on :80
# (use this INSTEAD of the Caddy profile in docker-compose.yml).
#
#   cp deploy/nginx-video-api.conf /etc/nginx/sites-available/video-api
#   ln -s /etc/nginx/sites-available/video-api /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d video-api.example.com     # rewrites this to add TLS
#
# A named server_name takes precedence over an existing `default_server`, so
# whatever else the box serves on :80 keeps working untouched.

server {
    listen 80;
    listen [::]:80;
    server_name video-api.example.com;

    # Video uploads come through this host. Keep it in step with
    # MAX_UPLOAD_BYTES on the collector.
    client_max_body_size 5g;

    access_log /var/log/nginx/video-api.access.log;
    error_log  /var/log/nginx/video-api.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Transcode progress (SSE). Buffering here would hold every event until the
    # job finished, which is precisely the opposite of the point.
    location ~ ^/v1/videos/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    # Uploads stream straight to disk; buffering the request would write the
    # whole file to nginx's temp dir first and double the disk churn.
    location = /v1/uploads {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout    30m;
        proxy_send_timeout    30m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }
}
