services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Role and database names are applied ONLY when the volume is empty, on
      # the very first boot, and are baked in from then on. An existing install
      # must keep whatever it was initialised with - changing these later points
      # the collector at a role that does not exist. Override in .env.
      POSTGRES_USER: ${POSTGRES_USER:-cinehost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinehost}
      POSTGRES_DB: ${POSTGRES_DB:-cinehost}
    volumes:
      # Postgres 18+ wants the mount one level up: the image puts the cluster in
      # a major-version subdirectory so `pg_upgrade --link` doesn't have to cross
      # a mount boundary. Mounting /var/lib/postgresql/data (the pre-18 path)
      # leaves the container crash-looping on start.
      - pgdata:/var/lib/postgresql
    ports:
      # 5433 on the host so it never collides with a local Postgres.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinehost}"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: packages/collector/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cinehost}:${POSTGRES_PASSWORD:-cinehost}@db:5432/${POSTGRES_DB:-cinehost}
      PORT: 8080
      UPLOAD_DIR: /data/uploads
      WORK_DIR: /data/work
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Uploaded originals + ffmpeg scratch. Survives restarts so an encode
      # interrupted by a deploy can resume instead of asking for a re-upload.
      - uploads:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Terminates TLS on the VPS with its own ACME cert, so it does not depend on
  # any existing wildcard on the box.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - collector
    profiles: ["vps"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
